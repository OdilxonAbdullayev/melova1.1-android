name: MELOVA - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MELOVA_SUPABASE_URL: ${{ secrets.MELOVA_SUPABASE_URL }}
      MELOVA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MELOVA_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify required shared Supabase settings
        run: python3 tests/verify_supabase_settings.py
      - name: Verify sources and embedded demo audio
        run: |
          python3 tests/verify_project.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MELOVA-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
